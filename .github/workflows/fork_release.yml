# FORK-ONLY: Build a signed arm64 APK and publish it as a GitHub Release.
#
# Obtainium watches this repo's releases, so each release carries exactly one APK
# asset — more than one and Obtainium has to guess which to install.
#
# Security note: this repo is public, so the trigger is deliberately limited to tag
# pushes and manual dispatch. There is no `pull_request` trigger — that keeps the
# signing key unreachable from any code a stranger could propose.
name: Fork Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, e.g. 1.3.5-cooldown.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "27.0.12077973"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned rather than tracking stable, so a Flutter release can't change
          # the output of a build that used to work.
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Resolve NDK path
        # ANDROID_HOME is set in the runner's environment, which is NOT in the `env`
        # expression context — ${{ env.ANDROID_HOME }} would expand to empty. Writing it
        # to $GITHUB_ENV here does put it in the context for later steps.
        run: echo "NDK_PATH=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache NDK
        # The NDK is a ~2.4GB download and dominates the run time. Keyed on the exact
        # version, so bumping NDK_VERSION misses the cache and reinstalls, as it should.
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_PATH }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Install NDK ${{ env.NDK_VERSION }}
        # Required: AGP 8.10.1 defaults to this exact version and android/app/build.gradle
        # pins it. AGP's own auto-download leaves a stub with no source.properties and
        # fails with [CXX1101], so install it explicitly.
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"

      - name: Verify NDK
        # Checked on cache hits too: a truncated cache restore would otherwise surface
        # much later as a confusing [CXX1101] Gradle failure.
        run: |
          test -f "$ANDROID_HOME/ndk/${NDK_VERSION}/source.properties" \
            || { echo "::error::NDK missing or incomplete at $ANDROID_HOME/ndk/${NDK_VERSION}"; exit 1; }

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          fi

          # versionCode must increase monotonically or Android refuses to install the
          # update. Derived from the run number rather than the tag, so it cannot
          # regress; offset well above the 120 baked into pubspec.yaml upstream.
          VERSION_CODE=$(( 1000 + ${{ github.run_number }} ))

          echo "name=$VERSION_NAME"   >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE"   >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Apply version to pubspec
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Reconstruct keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          # Fail loudly here rather than producing an unsigned or debug-signed APK
          test -s "$RUNNER_TEMP/keystore.jks" \
            || { echo "::error::KEYSTORE_BASE64 secret missing or invalid"; exit 1; }

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Verify signature
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK" || { echo "::error::No APK produced"; exit 1; }

          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt

          # A debug-signed APK cannot update the installed app, so refuse to publish one
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK is debug-signed"; exit 1
          fi

          mv "$APK" "mindful-fork-${{ steps.version.outputs.name }}-arm64.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" \
            --title "v${{ steps.version.outputs.name }}" \
            --notes "Personal fork of [Mindful](https://github.com/akaMrNagar/Mindful) with the cooldown gate.

          arm64 only. Signed with the fork key, so it cannot upgrade over a Play Store install of Mindful.

          versionCode \`${{ steps.version.outputs.code }}\`" \
            "mindful-fork-${{ steps.version.outputs.name }}-arm64.apk" \
            || gh release upload "v${{ steps.version.outputs.name }}" \
                 "mindful-fork-${{ steps.version.outputs.name }}-arm64.apk" --clobber

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"
